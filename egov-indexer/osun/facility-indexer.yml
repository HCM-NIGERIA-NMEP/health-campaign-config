ServiceMaps:
  serviceName: facility
  version: 1.0.0
  mappings:
    - topic: osun-save-facility-topic
      configKey: INDEX
      indexes:
        - name: osun-facility-index-v1
          type: facility
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
    - topic: osun-update-facility-topic
      configKey: INDEX
      indexes:
        - name: osun-facility-index-v1
          type: facility
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime
