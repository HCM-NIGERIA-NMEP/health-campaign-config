ServiceMaps:
  serviceName: Tracer
  version: 1.0.0
  mappings:
  - topic: tarabauat-error-details-indexer-topic
    configKey: INDEX
    indexes:
    - name: tarabauat-egov-tracer-error-details
      type: general
      id: $.uuid
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
